{% extends 'base.html' %}
{% load static %}
{% block title %}Nouveau mot de passe - SynergyCraft{% endblock %}
{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-900 to-gray-800 flex items-center justify-center px-4">
  <div class="max-w-md w-full bg-white/10 backdrop-blur-xl rounded-2xl p-8 border border-white/10">
    <h1 class="text-2xl font-bold text-white mb-6 text-center">Définir un nouveau mot de passe</h1>
    <form method="POST" class="space-y-4">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold rounded-xl hover:opacity-90 transition">Réinitialiser le mot de passe</button>
    </form>
  </div>
</div>
{% endblock %}
