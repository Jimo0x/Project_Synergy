{% extends 'base.html' %}
{% load static %}

{% block title %}Déconnexion - SynergyCraft{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <!-- Carte de déconnexion -->
        <div class="bg-white/10 backdrop-blur-xl rounded-2xl p-8 shadow-2xl border border-white/20 text-center">
            
            <!-- Animation de la main qui salue -->
            <div class="text-7xl mb-4 animate-wave">👋</div>
            
            <h1 class="text-3xl font-bold text-white mb-2">Au revoir !</h1>
            
            <p class="text-gray-300 mb-6">
                Êtes-vous sûr de vouloir vous déconnecter ?
            </p>
            
            <!-- Formulaire de déconnexion -->
            <form method="post" action="{% url 'logout' %}" class="space-y-3">
                {% csrf_token %}
                
                <button type="submit" 
                        class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-3 px-4 rounded-xl font-semibold hover:from-purple-700 hover:to-pink-700 transition-all transform hover:scale-105">
                    <i class="fas fa-sign-out-alt mr-2"></i>
                    Confirmer la déconnexion
                </button>
                
                <a href="{% url 'home' %}" 
                   class="block w-full bg-white/10 text-white py-3 px-4 rounded-xl font-semibold hover:bg-white/20 transition-all border border-white/20">
                    <i class="fas fa-home mr-2"></i>
                    Retour à l'accueil
                </a>
            </form>
            
            <!-- Message de sécurité -->
            <div class="mt-6 pt-4 border-t border-white/10 text-xs text-gray-400">
                <i class="fas fa-shield-alt mr-1"></i>
                Vos données sont sécurisées. À bientôt !
            </div>
        </div>
    </div>
</div>

<style>
    @keyframes wave {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(15deg); }
        75% { transform: rotate(-15deg); }
    }
    
    .animate-wave {
        animation: wave 1.5s ease-in-out infinite;
        transform-origin: bottom center;
        display: inline-block;
    }
    
    .backdrop-blur-xl {
        backdrop-filter: blur(20px);
    }
    
    .bg-white\/10 {
        background-color: rgba(255, 255, 255, 0.1);
    }
    
    .bg-white\/20 {
        background-color: rgba(255, 255, 255, 0.2);
    }
    
    .border-white\/10 {
        border-color: rgba(255, 255, 255, 0.1);
    }
    
    .border-white\/20 {
        border-color: rgba(255, 255, 255, 0.2);
    }
    
    .hover\:scale-105:hover {
        transform: scale(1.05);
    }
    
    .transition-all {
        transition: all 0.3s ease;
    }
</style>
{% endblock %}
