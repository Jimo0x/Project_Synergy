{% extends 'base.html' %}
{% load static %}
{% block title %}Email envoyé - SynergyCraft{% endblock %}
{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-900 to-gray-800 flex items-center justify-center px-4">
  <div class="max-w-md w-full bg-white/10 backdrop-blur-xl rounded-2xl p-8 text-center border border-white/10">
    <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-green-500/20 flex items-center justify-center">
      <i class="fas fa-check-circle text-3xl text-green-400"></i>
    </div>
    <h1 class="text-2xl font-bold text-white mb-2">Email envoyé</h1>
    <p class="text-gray-300 mb-6">Un email contenant les instructions de réinitialisation vous a été envoyé. Vérifiez votre boîte de réception.</p>
    <a href="{% url 'login' %}" class="inline-block px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold rounded-xl hover:opacity-90 transition">Retour à la connexion</a>
  </div>
</div>
{% endblock %}
